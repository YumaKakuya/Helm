name: MCPHUB Internal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          for f in CLAUDE.md docs/ lessons.md; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required docs present."
