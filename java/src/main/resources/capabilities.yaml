capabilities:
  - capability_id: "webfetch"
    display_name: "webfetch"
    provider_id: "builtin-hatch"
    access_class: "restricted"
    rw_boundary: "execute"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        url:
          type: string
          description: "URL to fetch"
        method:
          type: string
          default: "GET"
          description: "HTTP method (default: GET)"
        body:
          type: string
          description: "Request body (optional, for POST/PUT)"
        headers:
          type: object
          description: "Request headers as key-value pairs (optional)"
      required: [url]
    contract:
      purpose: "Fetch content from a URL (HTTP/HTTPS). Use for web page reading, API calls, or downloading resources. Modifies external state."
      may_do:
        - "Perform HTTP GET, POST, or other methods to external URLs"
        - "Return response body content"
      must_not_do:
        - "Cache responses"
        - "Store credentials in route log"
      when_to_call:
        - "The user asks to read a web page or call an external API"
        - "A URL is provided and external content retrieval is the goal"
      when_not_to_call:
        - "The task requires only local file reading"
        - "A local tool would suffice"
      side_effect_class: "external_state"
      timeout_hint_ms: 30000
      disambiguates_from:
        - capability_id: "websearch"
          distinction: "webfetch fetches a specific known URL; websearch discovers URLs via search query"

  - capability_id: "websearch"
    display_name: "websearch"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        query:
          type: string
          description: "Search query string"
      required: [query]
    contract:
      purpose: "Search the web for pages matching a query. Returns a list of results with titles, URLs, and snippets. Read-only."
      may_do:
        - "Issue web search queries and return result lists"
      must_not_do:
        - "Fetch full page content (use webfetch for that)"
        - "Submit forms or make state-changing requests"
      when_to_call:
        - "The user asks to search the web or find information about a topic"
        - "The URL is not yet known and discovery via search is needed"
      when_not_to_call:
        - "The URL is already known; use webfetch instead"
      side_effect_class: "none"
      timeout_hint_ms: 10000
      disambiguates_from:
        - capability_id: "webfetch"
          distinction: "websearch finds pages by query; webfetch fetches a specific URL"
        - capability_id: "codesearch"
          distinction: "websearch searches the public web; codesearch searches the local codebase"

  - capability_id: "todowrite"
    display_name: "todowrite"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        todos:
          type: array
          items:
            type: object
      required: [todos]
    contract:
      purpose: "Write or update the AI task list (todos). Use to track multi-step work in progress."
      may_do:
        - "Create, update, or replace the current todo list"
      must_not_do:
        - "Delete user files"
        - "Make external network calls"
      when_to_call:
        - "The AI needs to track a multi-step task plan"
        - "The user asks to update or clear the task list"
      when_not_to_call:
        - "A simple one-step task is being performed"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "list"
    display_name: "list"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        path:
          type: string
      required: [path]
    contract:
      purpose: "List files and directories at a given path. Read-only filesystem operation."
      may_do:
        - "Return directory listing for the given path"
      must_not_do:
        - "Modify files"
        - "Traverse symlinks outside the workspace"
      when_to_call:
        - "The user asks what files are in a directory"
        - "Directory content exploration is needed"
      when_not_to_call:
        - "A recursive search is needed; use codesearch or glob instead"
      side_effect_class: "none"
      timeout_hint_ms: 5000

  - capability_id: "apply_patch"
    display_name: "apply_patch"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        patch:
          type: string
          description: "Patch content. Supported formats (auto-detected): (1) git-style unified diff with '--- a/path' / '+++ b/path' headers (preferred, applied with patch -p1); (2) plain unified diff with '--- path' / '+++ path' headers (applied with patch -p0); (3) OpenAI/GPT '*** Begin Patch' format with '*** Add/Update/Delete File: path' directives and @@ hunks."
        cwd:
          type: string
          description: "Working directory to apply patch in (optional, defaults to current)"
      required: [patch]
    contract:
      purpose: "Apply a patch to files in the workspace. Supports git-style unified diff (preferred), plain unified diff, and OpenAI/GPT-style '*** Begin Patch' format. Modifies local file state."
      may_do:
        - "Apply git-style unified diff patches (patch -p1)"
        - "Apply plain unified diff patches (patch -p0)"
        - "Add, update, or delete files via Begin Patch format"
        - "Create new files if the patch specifies them"
      must_not_do:
        - "Apply patches outside the workspace root"
        - "Accept absolute paths or '..' path-segment traversal in any supported patch format"
        - "Make network calls"
      when_to_call:
        - "A patch or diff has been prepared and needs to be applied to files"
        - "An AI assistant has generated a Begin Patch block for file changes"
      when_not_to_call:
        - "Direct file editing is simpler; use edit or write instead"
      side_effect_class: "local_state"
      timeout_hint_ms: 10000

  - capability_id: "codesearch"
    display_name: "codesearch"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        pattern:
          type: string
          description: "Search pattern (regex)"
        path:
          type: string
          description: "Root path to search in (optional, defaults to cwd)"
        include:
          type: string
          description: "File glob filter (e.g. '*.ts', optional)"
      required: [pattern]
    contract:
      purpose: "Search the local codebase for files or content matching a pattern. Read-only."
      may_do:
        - "Search file content with regex or glob patterns"
        - "Return matching file paths and line numbers"
      must_not_do:
        - "Modify files"
        - "Search external URLs"
      when_to_call:
        - "The user needs to find code, functions, or strings in the codebase"
      when_not_to_call:
        - "Searching the web; use websearch instead"
        - "Listing a specific directory; use list instead"
      side_effect_class: "none"
      timeout_hint_ms: 15000
      disambiguates_from:
        - capability_id: "websearch"
          distinction: "codesearch searches local files; websearch searches the public web"

  - capability_id: "lsp"
    display_name: "lsp"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        command:
          type: string
          description: "LSP command (definition, references, hover)"
        file:
          type: string
          description: "Source file path"
        line:
          type: number
          description: "Line number (1-indexed, optional)"
        character:
          type: number
          description: "Character offset (optional)"
      required: [command, file]
    contract:
      purpose: "Query Language Server Protocol information: go-to-definition, hover, references. Read-only."
      may_do:
        - "Query LSP for definitions, references, hover information"
      must_not_do:
        - "Modify source files"
        - "Restart language servers"
      when_to_call:
        - "Precise symbol navigation or type information is needed"
      when_not_to_call:
        - "Simple pattern search suffices; use codesearch instead"
      side_effect_class: "none"
      timeout_hint_ms: 10000

  - capability_id: "plan_enter"
    display_name: "plan_enter"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        plan:
          type: string
    contract:
      purpose: "Enter planning mode. Commits the AI to a plan before execution begins."
      may_do:
        - "Record the current plan and enter plan-confirmed state"
      must_not_do:
        - "Execute the plan immediately without confirmation"
      when_to_call:
        - "The user has confirmed a plan and execution should proceed"
      when_not_to_call:
        - "No plan exists yet; draft the plan first"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000
      disambiguates_from:
        - capability_id: "plan_exit"
          distinction: "plan_enter begins plan execution; plan_exit ends it"

  - capability_id: "plan_exit"
    display_name: "plan_exit"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        summary:
          type: string
    contract:
      purpose: "Exit planning mode after execution is complete. Records plan completion."
      may_do:
        - "Mark the current plan as complete and exit plan-confirmed state"
      must_not_do:
        - "Discard uncommitted work without recording it"
      when_to_call:
        - "The plan has been fully executed and planning mode should end"
      when_not_to_call:
        - "The plan is still in progress"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000
      disambiguates_from:
        - capability_id: "plan_enter"
          distinction: "plan_exit ends plan execution; plan_enter begins it"

  - capability_id: "skill"
    display_name: "skill"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        name:
          type: string
      required: [name]
    contract:
      purpose: "Load and apply a named skill definition. Skills are operator-defined reusable instruction sets."
      may_do:
        - "Read skill definition by name and return its content"
      must_not_do:
        - "Modify skill files"
        - "Execute destructive actions from skill definitions without confirmation"
      when_to_call:
        - "A named skill needs to be applied to the current task"
      when_not_to_call:
        - "No relevant skill exists for the task"
      side_effect_class: "none"
      timeout_hint_ms: 5000

  - capability_id: "batch"
    display_name: "batch"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "execute"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        operations:
          type: array
          items:
            type: object
      required: [operations]
    contract:
      purpose: "Execute a batch of multiple tool operations in sequence. Use when many operations must run as a unit."
      may_do:
        - "Execute multiple tool calls in order as specified"
      must_not_do:
        - "Exceed the configured batch size limit"
        - "Skip operations without recording the skip"
      when_to_call:
        - "Multiple related operations must run atomically or sequentially"
      when_not_to_call:
        - "Only a single operation is needed; call it directly"
      side_effect_class: "local_state"
      timeout_hint_ms: 60000

  - capability_id: "nexus_issue_create"
    display_name: "nexus_issue_create"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        project:
          type: string
          description: "Project name (e.g. mcphub, hatch, axis)"
        title:
          type: string
          description: "Issue title"
        body:
          type: string
          description: "Markdown body of the issue"
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW, INFO]
          default: MEDIUM
          description: "Issue priority"
      required: [project, title, body]
    contract:
      purpose: "Create a new issue in the Nexus issue tracker under a project. Returns the created file path. Modifies local state."
      may_do:
        - "Create Markdown files under ~/issue-store/<project>/"
      must_not_do:
        - "Delete or modify existing issues"
        - "Write outside ~/issue-store/"
      when_to_call:
        - "A bug, finding, or to-do needs persistent cross-session tracking"
        - "Recording a problem discovered during investigation"
      when_not_to_call:
        - "The task is trivial and does not need cross-session persistence"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "nexus_issue_list"
    display_name: "nexus_issue_list"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        project:
          type: string
          description: "Project name (e.g. mcphub, hatch, axis)"
      required: [project]
    contract:
      purpose: "List open issues for a project in the Nexus issue tracker. Read-only."
      may_do:
        - "Read directory listings under ~/issue-store/<project>/"
      must_not_do:
        - "Modify any files"
      when_to_call:
        - "The session needs to know what issues remain open for a project"
        - "Finding candidate issues to close or update"
      when_not_to_call:
        - "Writing or closing issues"
      side_effect_class: "none"
      timeout_hint_ms: 5000

  - capability_id: "nexus_issue_close"
    display_name: "nexus_issue_close"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        project:
          type: string
          description: "Project name"
        file:
          type: string
          description: "Issue filename (from nexus_issue_list)"
        resolution:
          type: string
          description: "Optional resolution note to append before closing"
      required: [project, file]
    contract:
      purpose: "Close an issue by moving it to the closed/ subdirectory with an optional resolution note."
      may_do:
        - "Move issue files to closed/ subdirectory"
        - "Update issue status to CLOSED"
      must_not_do:
        - "Delete issue files"
        - "Close issues outside the project directory"
      when_to_call:
        - "An issue has been fully resolved and evidence is recorded"
        - "The fix has been merged and verified"
      when_not_to_call:
        - "The issue is still in progress"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "nexus_issue_update"
    display_name: "nexus_issue_update"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        project:
          type: string
          description: "Project name"
        file:
          type: string
          description: "Issue filename (from nexus_issue_list)"
        addition:
          type: string
          description: "Text to append to the issue"
      required: [project, file, addition]
    contract:
      purpose: "Append a status update or additional evidence to an existing issue."
      may_do:
        - "Append timestamped text to issue files"
      must_not_do:
        - "Delete or truncate existing content"
        - "Modify files outside the project directory"
      when_to_call:
        - "Updating an issue with new findings or progress"
        - "Recording verification evidence for an in-progress issue"
      when_not_to_call:
        - "The issue is ready to close; use nexus_issue_close"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "task_create"
    display_name: "task_create"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        title:
          type: string
          description: "Task title"
        description:
          type: string
          description: "Task description or details"
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          default: MEDIUM
      required: [title]
    contract:
      purpose: "Create a persistent task for cross-session tracking."
      may_do:
        - "Write tasks to ~/.config/mcphub/tasks.json"
      must_not_do:
        - "Modify other files"
      when_to_call:
        - "A new actionable item is discovered that should survive /clear"
      when_not_to_call:
        - "Volatile in-session reminders; use todowrite"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "task_list"
    display_name: "task_list"
    provider_id: "builtin-hatch"
    access_class: "safe"
    rw_boundary: "read"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, done, all]
          default: all
    contract:
      purpose: "List persistent tasks with optional status filter."
      may_do:
        - "Read ~/.config/mcphub/tasks.json"
      must_not_do:
        - "Modify any files"
      when_to_call:
        - "Session start: review remaining work from previous sessions"
      when_not_to_call:
        - "Creating or updating tasks"
      side_effect_class: "none"
      timeout_hint_ms: 5000

  - capability_id: "task_update"
    display_name: "task_update"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        id:
          type: string
          description: "Task ID from task_list"
        status:
          type: string
          enum: [open, in_progress, done]
          description: "New status (done = 消込)"
        note:
          type: string
          description: "Optional note"
      required: [id, status]
    contract:
      purpose: "Update task status. done = 消込."
      may_do:
        - "Modify tasks.json"
      must_not_do:
        - "Delete tasks (use task_delete)"
      when_to_call:
        - "Task completed — mark as done for 消込"
      when_not_to_call:
        - "Creating new tasks"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "task_delete"
    display_name: "task_delete"
    provider_id: "builtin-hatch"
    access_class: "guarded"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        id:
          type: string
          description: "Task ID from task_list"
      required: [id]
    contract:
      purpose: "Delete a task permanently."
      may_do:
        - "Remove task from tasks.json"
      must_not_do:
        - "Delete non-task files"
      when_to_call:
        - "Task is no longer relevant"
      when_not_to_call:
        - "Task is done — use task_update status=done instead"
      side_effect_class: "local_state"
      timeout_hint_ms: 5000

  - capability_id: "mcphub_checkpoint"
    display_name: "mcphub_checkpoint"
    provider_id: "mcphub-internal"
    access_class: "safe"
    rw_boundary: "write"
    enabled: true
    priority: 10
    schema:
      type: object
      properties:
        message:
          type: string
          description: "Handover message — what was done, what remains, context for next session"
        project:
          type: string
          description: "Project name for nexus issue listing (optional)"
      required: [message]
    contract:
      purpose: "Save current session state (tasks, nexus issues, handover note) as a persistent checkpoint for next-session handoff."
      may_do:
        - "Read tasks.json and issue-store directory"
        - "Write checkpoint state to MCPHUB data directory"
      must_not_do:
        - "Modify task state or nexus issues (only reads them)"
        - "Delete existing checkpoints"
      when_to_call:
        - "A session is ending and context needs to persist"
        - "Before a /clear or session close"
      when_not_to_call:
        - "A simple one-step task with no persistent context needed"
      side_effect_class: "local_state"
      timeout_hint_ms: 10000

  # -----------------------------------------------------------------------
  # Relay providers: configure in ~/.config/mcphub/relays.yaml
  # See README.md for format and examples.
  # -----------------------------------------------------------------------

policy:
  rules:
    - rule_id: "default-allow-all"
      tool_pattern: "*"
      action: "allow"
      priority: 1
      scope: "global"

    # Verdict provider: destructive reset tools denied by default.
    # Operators must explicitly grant access via a session rule to use these.
    - rule_id: "deny-test-db-reset"
      tool_pattern: "test_db_reset"
      action: "deny"
      priority: 9000
      scope: "global"

    - rule_id: "deny-test-cleanup-reset"
      tool_pattern: "test_cleanup_reset"
      action: "deny"
      priority: 9000
      scope: "global"
