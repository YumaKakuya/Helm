# MCPHUB relay provider configuration
# Copy to ~/.config/mcphub/relays.yaml and edit for your setup.
#
# Each relay entry defines an external MCP server that MCPHUB will
# spawn as a subprocess and route tool calls to.
#
# Format:
#   relays:
#     - id: "unique-relay-id"
#       command: ["/path/to/binary", "arg1", "arg2"]
#       tools: ["tool_name_1", "tool_name_2"]
#       capabilities:             # required for AI-visible tools not built into MCPHUB
#         - capability_id: "tool_name_1"
#           display_name: "tool_name_1"
#           provider_id: "my-provider"
#           access_class: "safe"
#           rw_boundary: "read"
#           enabled: true
#           priority: 10
#           schema:
#             type: object
#             properties:
#               query:
#                 type: string
#           contract:
#             purpose: "What this tool does"
#             may_do: ["allowed actions"]
#             must_not_do: ["forbidden actions"]
#             side_effect_class: "none"
#             timeout_hint_ms: 30000
#
# Environment variable override:
#   MCPHUB_RELAYS_PATH=/path/to/custom-relays.yaml

relays: []

# ---------------------------------------------------------------------------
# Example: Verdict. test-evidence provider
# ---------------------------------------------------------------------------
# Verdict. exposes 15 test_* MCP tools for scenario execution, evidence
# collection, browser automation, and database probing.
#
# Provider binary: /home/YOU/.local/share/verdict/current/bin/verdict-provider
# Provider ID:     mcphub_test_evidence_provider
#
# Use an absolute command path. MCPHUB starts providers with Java
# ProcessBuilder, so shell expansions like ${XDG_DATA_HOME:-...} are not
# expanded.
#
# Two tools are POLICY-DENIED by default in capabilities.yaml:
#   test_db_reset      — destructive DB baseline reset
#   test_cleanup_reset — destructive test-environment teardown
# To authorize them per session, add a session rule via the control API:
#   {"action":"allow","tool_pattern":"test_db_reset","priority":9500,"scope":"session"}
#
# Uncomment and copy to ~/.config/mcphub/relays.yaml to activate:
